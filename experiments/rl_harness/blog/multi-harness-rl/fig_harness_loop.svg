<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14">
  <title>What a harness does: it sits between a text-only language model and an environment, builds the prompt, parses the reply into an action, runs it, feeds the output back, and decides when to stop.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="880" height="424" fill="#fdfdfd"/>

  <!-- model -->
  <rect x="20" y="120" width="200" height="150" rx="6" fill="#fdfdfd" stroke="#0b5fff" stroke-width="2"/>
  <text x="36" y="148" font-weight="bold" fill="#1a1a1a">Language model</text>
  <text x="36" y="172" font-size="12" fill="#52514e">LFM2.5-2.6B</text>
  <text x="36" y="200" font-size="12" fill="#52514e">text in → text out</text>
  <text x="36" y="222" font-size="12" fill="#52514e">cannot run code</text>
  <text x="36" y="244" font-size="12" fill="#52514e">cannot open files</text>

  <!-- harness -->
  <rect x="300" y="30" width="280" height="340" rx="6" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="2"/>
  <text x="316" y="58" font-weight="bold" fill="#1a1a1a">Harness: the program around it</text>
  <g font-size="12">
    <rect x="316" y="74" width="248" height="62" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
    <text x="328" y="96" font-weight="bold" fill="#1a1a1a">1  Build the prompt</text>
    <text x="328" y="116" fill="#52514e">rules, tool list, task, history</text>

    <rect x="316" y="146" width="248" height="62" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
    <text x="328" y="168" font-weight="bold" fill="#1a1a1a">2  Parse the reply</text>
    <text x="328" y="188" fill="#52514e">tool call? bash block? an answer?</text>

    <rect x="316" y="218" width="248" height="62" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
    <text x="328" y="240" font-weight="bold" fill="#1a1a1a">3  Run the action</text>
    <text x="328" y="260" fill="#52514e">append its output to the history</text>

    <rect x="316" y="290" width="248" height="62" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
    <text x="328" y="312" font-weight="bold" fill="#1a1a1a">4  Decide when to stop</text>
    <text x="328" y="332" fill="#52514e">submit tool, magic line, turn limit</text>
  </g>

  <!-- model <-> harness -->
  <line x1="296" y1="165" x2="224" y2="165" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="232" y="157" font-size="11" fill="#666">prompt</text>
  <line x1="224" y1="225" x2="296" y2="225" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="240" y="217" font-size="11" fill="#666">reply</text>

  <!-- environment -->
  <rect x="660" y="120" width="200" height="150" rx="6" fill="#f3f2ee" stroke="#b9b8b2"/>
  <text x="676" y="148" font-weight="bold" fill="#1a1a1a">Environment</text>
  <text x="676" y="172" font-size="12" fill="#52514e">Docker sandbox, no network</text>
  <text x="676" y="204" font-size="12" font-family="DejaVu Sans Mono, Menlo, monospace" fill="#1a1a1a">employees.csv</text>
  <text x="676" y="224" font-size="12" font-family="DejaVu Sans Mono, Menlo, monospace" fill="#1a1a1a">departments.csv</text>
  <text x="676" y="250" font-size="12" fill="#52514e">python3, pandas, bash</text>

  <!-- harness <-> environment -->
  <line x1="584" y1="165" x2="656" y2="165" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="592" y="157" font-size="11" fill="#666">command</text>
  <line x1="656" y1="225" x2="584" y2="225" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="217" font-size="11" fill="#666">output</text>

  <!-- grader -->
  <rect x="660" y="310" width="200" height="60" rx="6" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="676" y="335" font-weight="bold" fill="#1a1a1a">Grader</text>
  <text x="676" y="355" font-size="12" fill="#52514e">answer = gold? → reward</text>
  <line x1="584" y1="340" x2="656" y2="340" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="590" y="332" font-size="11" fill="#666">answer</text>

  <!-- loop note -->
  <text x="20" y="318" font-size="12" fill="#52514e">steps 1 → 3 repeat, one model</text>
  <text x="20" y="336" font-size="12" fill="#52514e">call per turn, until step 4 says</text>
  <text x="20" y="354" font-size="12" fill="#52514e">stop (at most 10 turns here)</text>

  <text x="20" y="410" font-size="12" fill="#666">Claude Code, Codex, OpenCode and mini-SWE-agent all do these four jobs, each in its own way.</text>
</svg>
